name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          unzip -o ThimbleAndThread-project.zip -d tmp
          rm -rf tmp/ThimbleAndThread/.github
          cp -a tmp/ThimbleAndThread/. .
          rm -rf tmp ThimbleAndThread-project.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project scaffold"
          git push
