# Builds a sideloadable Android APK on every push to main.
# One-time setup: add repo secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
# (see https://game.ci/docs/github/activation). Download the APK from the run's Artifacts.
name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The Unity Android image is larger than the runner's free disk; remove unused preinstalled tools.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      # Unity's Android (IL2CPP) build can need more memory than the runner's ~7 GB; without extra swap
      # the build gets killed (exit code 137). /mnt is a separate disk with free space.
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage   # .apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThimbleAndThread-apk
          path: build/Android
