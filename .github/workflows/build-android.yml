# Builds a sideloadable Android APK on every push to main.
# One-time setup: add repo secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
# (see https://game.ci/docs/github/activation). Download the APK from the run's Artifacts.
name: Build Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage   # .apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThimbleAndThread-apk
          path: build/Android
